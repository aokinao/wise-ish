name: Deploy to App Store Connect

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: wiseish-app-store-connect
  cancel-in-progress: false

jobs:
  deploy:
    name: Archive and upload Wise-ish
    runs-on: macos-26
    environment: app-store-connect
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Validate deployment secrets
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.WISEISH_APP_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WISEISH_WIDGET_PROVISION_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.WISEISH_SHARE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          required_secrets=(ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64 BUILD_CERTIFICATE_BASE64 P12_PASSWORD APP_PROFILE_BASE64 WIDGET_PROFILE_BASE64 SHARE_PROFILE_BASE64 KEYCHAIN_PASSWORD)
          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "::error::Missing GitHub secret: ${secret_name}"
              exit 1
            fi
          done

      - name: Install signing credentials
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          APP_PROFILE_BASE64: ${{ secrets.WISEISH_APP_PROVISION_PROFILE_BASE64 }}
          WIDGET_PROFILE_BASE64: ${{ secrets.WISEISH_WIDGET_PROVISION_PROFILE_BASE64 }}
          SHARE_PROFILE_BASE64: ${{ secrets.WISEISH_SHARE_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/wiseish_distribution.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/wiseish-signing.keychain-db"
          API_KEY_DIRECTORY="$RUNNER_TEMP/private_keys"
          API_KEY_PATH="$API_KEY_DIRECTORY/AuthKey_${ASC_KEY_ID}.p8"
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$API_KEY_DIRECTORY" "$PROFILE_DIRECTORY"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$ASC_KEY_BASE64" | base64 --decode -o "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          install_profile() {
            local encoded="$1"
            local output="$RUNNER_TEMP/$2.mobileprovision"
            echo -n "$encoded" | base64 --decode -o "$output"
            security cms -D -i "$output" > "$output.plist"
            local uuid
            uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$output.plist")"
            local name
            name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$output.plist")"
            cp "$output" "$PROFILE_DIRECTORY/${uuid}.mobileprovision"
            echo "${2}_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
            echo "${2}_PROFILE_NAME=$name" >> "$GITHUB_ENV"
          }
          install_profile "$APP_PROFILE_BASE64" WISEISH_APP
          install_profile "$WIDGET_PROFILE_BASE64" WISEISH_WIDGET
          install_profile "$SHARE_PROFILE_BASE64" WISEISH_SHARE
          echo "API_KEY_PATH=$API_KEY_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "PROFILE_DIRECTORY=$PROFILE_DIRECTORY" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries[]
            | select(.key | contains("iOS-26"))
            | .value[]
            | select(.name | startswith("iPhone"))
            | .udid
          ' | head -n 1)"
          if [[ -z "$simulator_id" ]]; then
            echo "::error::No available iOS 26 iPhone simulator was found"
            exit 1
          fi
          echo "Using simulator: $simulator_id"
          xcodebuild -project Wiseish/Wiseish.xcodeproj -scheme Wiseish \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:WiseishTests test

      - name: Archive
        run: |
          set -euo pipefail
          BUILD_NUMBER="${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          xcodebuild archive -project Wiseish/Wiseish.xcodeproj -scheme Wiseish \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Wiseish.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM=YE3JSRF22E \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' \
            WISEISH_APP_PROFILE_NAME="$WISEISH_APP_PROFILE_NAME" \
            WISEISH_WIDGET_PROFILE_NAME="$WISEISH_WIDGET_PROFILE_NAME" \
            WISEISH_SHARE_PROFILE_NAME="$WISEISH_SHARE_PROFILE_NAME"

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>upload</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>YE3JSRF22E</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>com.naoki.Wiseish</key><string>${WISEISH_APP_PROFILE_NAME}</string>
              <key>com.naoki.Wiseish.WiseishWidget</key><string>${WISEISH_WIDGET_PROFILE_NAME}</string>
              <key>com.naoki.Wiseish.WiseishShare</key><string>${WISEISH_SHARE_PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Wiseish.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates -authenticationKeyPath "$API_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up signing credentials
        if: ${{ always() }}
        run: |
          security delete-keychain "${KEYCHAIN_PATH:-}" 2>/dev/null || true
          if [[ -n "${PROFILE_DIRECTORY:-}" ]]; then
            rm -f "$PROFILE_DIRECTORY/${WISEISH_APP_PROFILE_UUID:-}.mobileprovision"
            rm -f "$PROFILE_DIRECTORY/${WISEISH_WIDGET_PROFILE_UUID:-}.mobileprovision"
            rm -f "$PROFILE_DIRECTORY/${WISEISH_SHARE_PROFILE_UUID:-}.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/private_keys"
