<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f2e8d5" />
    <meta
      name="description"
      content="Wise-ish — 一日ひとつ、答えのない日めくり。"
    />
    <title>Wise-ish — Daily philosophical misquotes</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="app-shell" aria-label="Wise-ish app prototype">
        <div class="paper-noise" aria-hidden="true"></div>

        <header class="topbar">
          <a class="brand" href="#" aria-label="Wise-ish ホーム">
            <span>Wise</span><i>–</i><span>ish</span>
          </a>
          <button class="icon-button" id="soundButton" type="button" aria-label="音の切り替え" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M5 10v4h3l4 3V7L8 10H5Z" />
              <path class="sound-wave" d="M15 9.5c.8.7 1.2 1.5 1.2 2.5s-.4 1.8-1.2 2.5M17.5 7c1.4 1.4 2.1 3 2.1 5s-.7 3.6-2.1 5" />
            </svg>
          </button>
        </header>

        <section class="date-row" aria-label="今日の日付">
          <p class="eyebrow">TODAY, PERHAPS</p>
          <div class="date-lockup">
            <span class="date-number" id="dateNumber">24</span>
            <span class="date-meta">
              <b id="monthName">AUG</b>
              <em id="weekdayName">MONDAY</em>
            </span>
          </div>
        </section>

        <section class="quote-area" aria-live="polite">
          <article class="quote-card" id="quoteCard">
            <div class="quote-card__rings" aria-hidden="true">
              <i></i><i></i><i></i><i></i>
            </div>
            <p class="quote-label">今日の Wise-ish</p>
            <blockquote id="quoteText">
              選ばなかった道にも、<br />たぶん工事中はある。
            </blockquote>
            <div class="quote-footer">
              <span id="quoteTheme"># 選択について</span>
              <button class="favorite-button" id="favoriteButton" type="button" aria-label="お気に入りに追加" aria-pressed="false">
                <svg aria-hidden="true" viewBox="0 0 24 24">
                  <path d="M12 20.2 3.7 12A5.2 5.2 0 0 1 11 4.6l1 1 1-1A5.2 5.2 0 0 1 20.3 12L12 20.2Z" />
                </svg>
              </button>
            </div>
          </article>

          <div class="mascot-wrap" id="mascotButton" role="button" tabindex="0" aria-label="Ishをつつく">
            <span class="thought-bubble" id="thoughtBubble" aria-hidden="true">たぶんね。</span>
            <span class="mascot-shadow" aria-hidden="true"></span>
            <img
              class="mascot"
              src="../design/mascot/ish-master.png"
              alt="何かを言いかけて忘れたような、小さな仙人のキャラクターIsh"
            />
            <span class="tap-hint">つついてみる</span>
          </div>
        </section>

        <section class="reflection-card">
          <span class="reflection-mark" aria-hidden="true">?</span>
          <div>
            <p>今日の問い</p>
            <h2 id="reflectionText">選ばなかったものを、美化していないだろうか。</h2>
          </div>
        </section>

        <section class="mood-section" aria-labelledby="moodTitle">
          <div class="section-heading">
            <h2 id="moodTitle">今日は、どんな感じ？</h2>
            <button id="nextButton" class="text-button" type="button">もう一枚</button>
          </div>
          <div class="mood-picker" role="group" aria-label="今日の気分">
            <button type="button" data-mood="quiet" aria-pressed="true">
              <span>◌</span>静か
            </button>
            <button type="button" data-mood="foggy" aria-pressed="false">
              <span>≈</span>ぼんやり
            </button>
            <button type="button" data-mood="thinking" aria-pressed="false">
              <span>…</span>考えすぎ
            </button>
          </div>
        </section>

        <nav class="bottom-nav" aria-label="メインナビゲーション">
          <a class="active" href="#today" aria-current="page">
            <span class="nav-icon calendar-icon" aria-hidden="true"></span>
            今日
          </a>
          <a href="#archive">
            <span class="nav-icon archive-icon" aria-hidden="true"></span>
            日々
          </a>
          <a href="#favorites">
            <span class="nav-icon heart-icon" aria-hidden="true">♡</span>
            余韻
          </a>
        </nav>
      </section>

      <aside class="prototype-note">
        <span>INTERACTIVE PROTOTYPE</span>
        <p>気分を選ぶ、Ishをつつく、<br />「もう一枚」を押してみてください。</p>
      </aside>
    </main>

    <script src="app.js"></script>
  </body>
</html>
