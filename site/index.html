<h1>Wise-ish</h1>
<p>今日を、雑に眺める。</p>
<p>日付と、少し深くてだいたい迷言な一言を、Ishが静かに置いていきます。世界の真理も、冷蔵庫のプリンも、同じ深刻さで考える生き物です。</p>
<p>頑張らなくていい日のための、日めくりカレンダー。</p>
