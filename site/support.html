<h1>Wise-ish サポート</h1>
<h2>お問い合わせ</h2>
<p>不具合やご要望は、<a href="https://github.com/aokinao/wise-ish/issues">GitHub Issues</a>からお知らせください。</p>
<h2>Widgetの追加</h2>
<p>ホーム画面を長押しし、「編集」→「ウィジェットを追加」から「Wise-ish」を選びます。表示されない場合は、アプリを一度終了して再起動するか、アプリを再インストールしてください。</p>
<h2>対応環境</h2>
<p>iOS 26以降。端末や設定によって、一部のAI機能が利用できない場合があります。</p>
